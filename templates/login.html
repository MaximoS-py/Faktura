{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>Přihlášení do systému</h2>
    <p style="color: #6b7280; font-size: 0.9rem;">Výchozí údaje: <strong>admin</strong> / <strong>admin123</strong></p>
    <form method="POST">
        <div class="form-group">
            <label>Uživatelské jméno</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Heslo</label>
            <input type="password" name="password" style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:4px;" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Přihlásit se</button>
    </form>
</div>
{% endblock %}
