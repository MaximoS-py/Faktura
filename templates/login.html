{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>Přihlášení do systému</h2>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Uživatelské jméno</label>
            <input type="text" name="username" required
                   style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:4px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Heslo</label>
            <input type="password" name="password" required
                   style="width:100%; padding:8px; border:1px solid #d1d5db; border-radius:4px;">
        </div>

        <button type="submit"
                style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold;">
            Přihlásit se
        </button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        Nemáte ještě účet?
        <a href="{{ url_for('register') }}">Zaregistrujte se zde</a>.
    </p>
</div>
{% endblock %}
