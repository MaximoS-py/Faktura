<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Přehled faktur</title>
    <style>
        body { font-family: Arial; background:#f3f4f6; padding:20px; }
        table { width:100%; border-collapse:collapse; background:white; }
        th, td { padding:10px; border-bottom:1px solid #ddd; }
        a { color:#2563eb; }
        .top { display:flex; justify-content:space-between; margin-bottom:20px; }
    </style>
</head>
<body>

<div class="top">
    <div>Přihlášen: <strong>{{ session['uzivatel'] }}</strong></div>
    <div>
        <a href="{{ url_for('profil') }}">Profil</a> |
        <a href="{{ url_for('logout') }}">Odhlásit</a>
    </div>
</div>

<h2>Moje faktury</h2>

<a href="{{ url_for('nova_faktura') }}">+ Nová faktura</a>

<table>
    <tr>
        <th>Číslo</th>
        <th>Datum</th>
        <th>Odběratel</th>
        <th>Celkem</th>
        <th>Akce</th>
    </tr>

    {% for f in faktury %}
    <tr>
        <td>{{ f.cislo_faktury }}</td>
        <td>{{ f.datum_vystaveni }}</td>
        <td>{{ f.odberatel_firma }}</td>
        <td>{{ "%.2f"|format(f.total_price) }} Kč</td>
        <td>
            <a href="{{ url_for('faktura_detail', id=f.id) }}">Detail</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
