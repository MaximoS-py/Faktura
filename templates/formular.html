<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Nová faktura</title>
    <style>
        body { font-family: Arial; background:#f3f4f6; padding:20px; }
        .box { max-width:800px; margin:auto; background:white; padding:30px; border-radius:8px; }
        input { width:100%; padding:10px; margin-bottom:15px; }
        button { padding:10px 20px; background:#2563eb; color:white; border:none; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:10px; border-bottom:1px solid #ddd; }
    </style>
</head>
<body>

<div class="box">
    <h2>Nová faktura</h2>

    <form method="POST">

        <h3>Základní údaje</h3>
        <input type="text" name="cislo_faktury" placeholder="Číslo faktury" required>
        <input type="date" name="datum_vystaveni" required>
        <input type="date" name="datum_splatnosti" required>

        <h3>Odběratel</h3>
        <input type="text" name="odberatel_firma" placeholder="Firma" required>
        <input type="text" name="odberatel_adresa" placeholder="Adresa" required>
        <input type="text" name="odberatel_ico" placeholder="IČO" required>
        <input type="email" name="odberatel_email" placeholder="E-mail">

        <h3>Položky</h3>
        <table>
            <tr>
                <th>Popis</th>
                <th>Množství</th>
                <th>Cena</th>
                <th>DPH %</th>
            </tr>

            {% for i in range(5) %}
            <tr>
                <td><input name="popis[]"></td>
                <td><input name="mnozstvi[]" type="number" step="0.01"></td>
                <td><input name="cena[]" type="number" step="0.01"></td>
                <td><input name="dph[]" type="number" value="21"></td>
            </tr>
            {% endfor %}
        </table>

        <p>Přenesená daň: <input type="checkbox" name="prenesena_dan" value="ANO"></p>

        <button>Vytvořit fakturu</button>
    </form>

    <p><a href="{{ url_for('index') }}">Zpět</a></p>
</div>

</body>
</html>
