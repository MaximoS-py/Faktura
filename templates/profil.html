<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Můj profil</title>
    <style>
        body { font-family: Arial; background:#f3f4f6; padding:20px; }
        .box { max-width:600px; margin:auto; background:white; padding:30px; border-radius:8px; }
        input { width:100%; padding:10px; margin-bottom:15px; }
        button { width:100%; padding:10px; background:#2563eb; color:white; border:none; }
        a { color:#2563eb; }
    </style>
</head>
<body>

<div class="box">
    <h2>Můj profil</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div style="color:green;">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="firma" value="{{ profil.firma }}" placeholder="Firma" required>
        <input type="text" name="ulice" value="{{ profil.ulice }}" placeholder="Ulice" required>
        <input type="text" name="mesto" value="{{ profil.mesto }}" placeholder="Město" required>
        <input type="text" name="ico" value="{{ profil.ico }}" placeholder="IČO" required>
        <input type="text" name="dic" value="{{ profil.dic }}" placeholder="DIČ">
        <input type="text" name="ucet" value="{{ profil.ucet }}" placeholder="Účet" required>

        <p>Logo:</p>
        {% if profil.logo %}
            <p>Aktuální logo: {{ profil.logo }}</p>
        {% endif %}
        <input type="file" name="logo">

        <button>Uložit</button>
    </form>

    <p><a href="{{ url_for('index') }}">Zpět</a></p>
</div>

</body>
</html>
