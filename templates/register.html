{% extends "base.html" %}
{% block title %}Registrace{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>Registrace nového uživatele</h2>

    <form method="POST" action="{{ url_for('register') }}">
        <label>Uživatelské jméno</label>
        <input type="text" name="username" required>

        <label>Heslo</label>
        <input type="password" name="password" required>

        <label>Název firmy / jméno</label>
        <input type="text" name="firma" required>

        <label>IČO</label>
        <input type="text" name="ico" required>

        <label>Číslo účtu</label>
        <input type="text" name="ucet" required>

        <button type="submit"
                style="width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:4px; font-weight:bold;">
            Registrovat
        </button>
    </form>
</div>
{% endblock %}
