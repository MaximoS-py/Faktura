<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Registrace</title>
    <style>
        body { font-family: Arial; background:#f3f4f6; padding:40px; }
        .box { max-width:450px; margin:auto; background:white; padding:30px; border-radius:8px; }
        input { width:100%; padding:10px; margin-bottom:15px; }
        button { width:100%; padding:10px; background:#16a34a; color:white; border:none; }
        a { color:#2563eb; }
    </style>
</head>
<body>

<div class="box">
    <h2>Registrace</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div style="color:red;">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Uživatelské jméno" required>
        <input type="password" name="password" placeholder="Heslo" required>

        <h3>Firemní údaje</h3>
        <input type="text" name="firma" placeholder="Název firmy" required>
        <input type="text" name="ico" placeholder="IČO" required>
        <input type="text" name="ucet" placeholder="Číslo účtu (např. 123456789/0100)" required>

        <button>Registrovat</button>
    </form>

    <p>Máte účet? <a href="{{ url_for('login') }}">Přihlásit se</a></p>
</div>

</body>
</html>
